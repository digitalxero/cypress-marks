name: cypress-marks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  compatibility:
    name: Cypress ${{ matrix.cypress }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cypress: ['13.17.0', '15.10.0', '16.0.0', '16.2.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npm install --no-save --package-lock=false cypress@${{ matrix.cypress }}
      - run: npx cypress install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
  release:
    name: Tag and publish verified main
    needs: [build, compatibility]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Install pinned release tools
        run: |
          go install github.com/caarlos0/svu/v3@v3.4.1
          go install github.com/goreleaser/chglog/cmd/chglog@v0.7.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Version, tag, publish, and create GitHub release
        run: node .repo-policy/npm-release.mjs
