name: cypress-marks
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  compatibility:
    name: Cypress ${{ matrix.cypress }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cypress: ['13.17.0', '15.10.0', '16.0.0', '16.2.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npm install --no-save --package-lock=false cypress@${{ matrix.cypress }}
      - run: npx cypress install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
  release:
    name: Publish verified version tag
    needs: [build, compatibility]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Install pinned release tools
        run: |
          go install github.com/caarlos0/svu/v3@v3.4.1
          go install github.com/goreleaser/chglog/cmd/chglog@v0.7.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify reviewed version and generate changelog
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(svu current --strip-prefix)
          test "$VERSION_TAG" = "v$VERSION"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          if [ ! -f changelog.yml ]; then
            chglog init --conventional-commits --exclude-merge-commits
          fi
          chglog format --template release --output release-notes.md
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance
      - name: Create GitHub release using chglog notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: gh release create "$VERSION_TAG" --notes-file release-notes.md
